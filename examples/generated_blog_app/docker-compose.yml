# Secrets are never stored in this file: compose fails fast when they are not provided.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/blog?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (min 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: "true"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8080:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  mongo-data:
